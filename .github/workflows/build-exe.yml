name: Build EXE

# Compila el .exe en cada subida a una rama (o a mano desde la pestaña Actions) y lo deja
# como artefacto y como pre-release «dev-N», para poder bajarlo y probarlo sin crear una versión.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write       # crear la pre-release de prueba

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Compilar
        run: pyinstaller --onefile --noconsole --clean --exclude-module numpy --add-data "assets/star.png;assets" --add-data "assets/logo.png;assets" --icon assets/icon.ico --name LuxkorAccountManager roblox_manager.py
      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/LuxkorAccountManager.exe -Algorithm SHA256).Hash.ToLower()
          "$h  LuxkorAccountManager.exe" | Out-File -Encoding ascii dist/LuxkorAccountManager.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LuxkorAccountManager-${{ github.sha }}
          path: |
            dist/LuxkorAccountManager.exe
            dist/LuxkorAccountManager.exe.sha256
          retention-days: 30
      - name: Pre-release de prueba
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dev-${{ github.run_number }}"
          $short = "${{ github.sha }}".Substring(0, 7)
          gh release create $tag dist/LuxkorAccountManager.exe dist/LuxkorAccountManager.exe.sha256 `
            --prerelease --target "${{ github.sha }}" `
            --title "Build de prueba $tag ($short, rama ${{ github.ref_name }})" `
            --notes "Compilación automática de $short en la rama ${{ github.ref_name }}. No es una versión oficial."
      - name: Limpiar pre-releases antiguas (se conservan las 5 últimas)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = gh release list --limit 100 --json tagName,createdAt | ConvertFrom-Json |
            Where-Object { $_.tagName -like 'dev-*' } | Sort-Object createdAt -Descending | Select-Object -Skip 5
          foreach ($r in $old) { gh release delete $r.tagName --cleanup-tag --yes }
