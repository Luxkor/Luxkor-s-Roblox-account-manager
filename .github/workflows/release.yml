name: Release

# Se ejecuta al subir una etiqueta, p. ej.:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # crear la release
  id-token: write       # firmar la procedencia (attestation)
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -m unittest discover -s tests
      - name: Compilar
        run: pyinstaller --onefile --noconsole --clean --icon assets/icon.ico --name LuxkorAccountManager roblox_manager.py
      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/LuxkorAccountManager.exe -Algorithm SHA256).Hash.ToLower()
          "$h  LuxkorAccountManager.exe" | Out-File -Encoding ascii dist/LuxkorAccountManager.exe.sha256
      - name: Procedencia verificable
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/LuxkorAccountManager.exe
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/LuxkorAccountManager.exe
            dist/LuxkorAccountManager.exe.sha256
